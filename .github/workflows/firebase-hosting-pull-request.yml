# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR
on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      # -------------------------------------------------------------------
      # SECRET VALIDATION
      # -------------------------------------------------------------------
      - name: Validate Firebase secrets
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIRESTORE_DATABASE: ${{ secrets.NEXT_PUBLIC_FIRESTORE_DATABASE }}
          NEXT_PUBLIC_FIREBASE_DATABASE_URL: ${{ secrets.NEXT_PUBLIC_FIREBASE_DATABASE_URL }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_RECAPTCHA_V3: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_V3 }}
          FIREBASE_SERVICE_ACCOUNT_ORANGE_TREADS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORANGE_TREADS }}
        run: |
          echo "Checking presence of required Firebase secrets..."

          required_vars=(
            NEXT_PUBLIC_FIREBASE_API_KEY
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
            NEXT_PUBLIC_FIRESTORE_DATABASE
            NEXT_PUBLIC_FIREBASE_DATABASE_URL
            NEXT_PUBLIC_FIREBASE_PROJECT_ID
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
            NEXT_PUBLIC_FIREBASE_APP_ID
            NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
            NEXT_PUBLIC_RECAPTCHA_V3
          )

          for var in "${required_vars[@]}"; do
            if [ -z "${!var}" ]; then
              echo "❌ MISSING: $var"
              exit 1
            else
              echo "✅ $var present"
            fi
          done

          echo "Validating service account JSON..."
          python3 <<EOF
          import os, json, sys
          raw = os.environ.get("FIREBASE_SERVICE_ACCOUNT_ORANGE_TREADS")
          if not raw:
              print("❌ Missing FIREBASE_SERVICE_ACCOUNT_ORANGE_TREADS")
              sys.exit(1)
          try:
              sa = json.loads(raw)
              print("Service account OK:")
              print("  project_id:", sa.get("project_id"))
              print("  client_email:", sa.get("client_email"))
          except Exception as e:
              print("❌ INVALID SERVICE ACCOUNT JSON:", e)
              sys.exit(1)
          EOF

      # -------------------------------------------------------------------
      # INSTALL + BUILD
      # -------------------------------------------------------------------
      - name: Install and build
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIRESTORE_DATABASE: ${{ secrets.NEXT_PUBLIC_FIRESTORE_DATABASE }}
          NEXT_PUBLIC_FIREBASE_DATABASE_URL: ${{ secrets.NEXT_PUBLIC_FIREBASE_DATABASE_URL }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_RECAPTCHA_V3: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_V3 }}
          FIREBASE_SERVICE_ACCOUNT_ORANGE_TREADS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORANGE_TREADS }}
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # -------------------------------------------------------------------
      # DEPLOY TO FIREBASE PREVIEW CHANNEL
      # -------------------------------------------------------------------
      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORANGE_TREADS }}
          projectId: orange-treads
